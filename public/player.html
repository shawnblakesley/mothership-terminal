<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="player.css">
</head>
<body class="theme-green">
  <div id="crt">
    <header id="hdr">
      <span id="hdr-station">----</span>
      <span class="sep">//</span>
      <span>HV-CORE OS v4.1</span>
      <span class="grow"></span>
      <span>ACCESS: <b id="hdr-access">GUEST</b></span>
      <span class="sep">//</span>
      <span id="hdr-clock">00:00:00</span>
      <span id="hdr-link" class="link" title="Connection">● LINK</span>
      <span class="sep">//</span>
      <span class="vol">
        <button id="vol-mute" type="button" title="Mute / unmute">VOL</button>
        <span id="vol-bars" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="10"></span>
      </span>
    </header>
    <main id="screen">
      <div id="lines" aria-live="polite"></div>
      <div id="busy" hidden>PROCESSING<span class="dots"></span></div>
      <form id="inputrow" autocomplete="off">
        <label id="prompt" for="in">GUEST&gt;</label>
        <input id="in" spellcheck="false" autocapitalize="characters" autofocus>
        <span id="caret"></span>
      </form>
    </main>
  </div>
  <div id="fx"></div>

  <div id="boot">
    <pre id="boot-text"></pre>
    <div id="boot-press">[ PRESS ANY KEY ]</div>
  </div>

  <div class="crt-glass" aria-hidden="true">
    <div class="grille"></div>
    <div class="scan"></div>
    <div class="roll"></div>
    <div class="grain"></div>
    <div class="bezel"></div>
  </div>

  <script src="effects.js"></script>
  <script src="voice.js"></script>
  <script src="player.js"></script>
</body>
</html>
