<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="player.css">
</head>
<body class="theme-green">
  <div id="crt">
    <header id="hdr">
      <span id="hdr-station">----</span>
      <span class="sep">//</span>
      <span>HV-CORE OS v4.1</span>
      <span class="grow"></span>
      <span>ACCESS: <b id="hdr-access">GUEST</b></span>
      <span class="sep">//</span>
      <span id="hdr-clock">00:00:00</span>
      <span id="hdr-link" class="link" title="Connection">● LINK</span>
      <span class="sep">//</span>
      <span class="vol">
        <button id="vol-mute" type="button" title="Mute / unmute">VOL</button>
        <span id="vol-bars" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="10"></span>
      </span>
    </header>
    <main id="screen">
      <div id="lines" aria-live="polite"></div>
      <div id="busy" hidden>PROCESSING<span class="dots"></span></div>
      <!-- Ability roll called by the Warden (Mothership: roll d100 under Stat + Skill). -->
      <section id="rollbox" class="rollbox" hidden aria-live="polite">
        <div class="rb-title">■ ROLL REQUIRED ■</div>
        <div id="rb-label"></div>
        <div id="rb-reason" class="rb-dim"></div>
        <form id="rb-form" autocomplete="off">
          <label id="rb-stat-row" for="rb-stat"><span id="rb-stat-name">YOUR STAT</span>: <input id="rb-stat" inputmode="numeric" maxlength="2" size="3"></label>
          <div class="rb-actions">
            <button id="rb-roll" type="submit">[ ROLL D100 ]</button>
            <span class="rb-dim">OR ENTER YOUR DICE:</span>
            <input id="rb-dice" inputmode="numeric" size="7" aria-label="Your dice">
            <button id="rb-enter" type="button">[ ENTER ]</button>
          </div>
          <div id="rb-err" role="alert"></div>
        </form>
      </section>
      <form id="inputrow" autocomplete="off">
        <label id="prompt" for="in">GUEST&gt;</label>
        <input id="in" spellcheck="false" autocapitalize="characters" autofocus>
        <span id="caret"></span>
      </form>
    </main>
  </div>
  <div id="fx"></div>
  <div id="rollfx" class="rollfx" hidden aria-live="assertive"><div class="rf-dice"></div><div class="rf-out"></div></div>

  <div id="boot">
    <pre id="boot-text"></pre>
    <div id="boot-press" hidden>[ PRESS ANY KEY ]</div>
    <form id="join" hidden autocomplete="off">
      <label for="join-code">ENTER SESSION CODE:</label>
      <input id="join-code" maxlength="12" spellcheck="false" autocapitalize="characters" aria-describedby="join-err">
      <div id="join-err" role="status"></div>
      <p class="warden-link"><a href="dm">RUNNING THE GAME? START A SESSION AS WARDEN ›</a></p>
    </form>
  </div>

  <div class="crt-glass" aria-hidden="true">
    <div class="grille"></div>
    <div class="scan"></div>
    <div class="roll"></div>
    <div class="grain"></div>
    <div class="bezel"></div>
  </div>

  <script src="effects.js"></script>
  <script src="voice.js"></script>
  <script src="sfx.js"></script>
  <script src="player.js"></script>
</body>
</html>
